name: CI

# Lint and build every pull request and every push to main. Publishing is publish.yml's job.
# `ci-ok` is the required check of this repository's default-branch ruleset (managed in
# MartinDoyleUK/terraform, github/rulesets.tf): a pull request merges only once it has passed
# on a branch that is up to date with main. Keep the job name, which the ruleset requires by
# name, and add no path filters: a required check that never reports blocks the pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - name: Smoke test the card
        run: node dist/index.js
