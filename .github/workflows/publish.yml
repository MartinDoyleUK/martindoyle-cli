name: Publish to npm

# Publishes the package when a GitHub release is published. Authenticates with npm trusted
# publishing (OIDC), so there is no NPM_TOKEN: the package's trusted publisher on npmjs.com names
# this repository and this workflow file, so renaming either breaks publishing.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing

# One publish at a time, and every release waits its turn: the default queue keeps only one
# pending run and cancels it when another arrives, and a cancelled release event is not replayed.
concurrency:
  group: publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # npm publish without --tag moves `latest`, so a GitHub prerelease must not publish.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The release's tag must name the version in package.json and a commit on main, so a stale
      # tag (v1.1.0 points at a commit that never reached main) cannot publish unreviewed code.
      - name: Check the tag against package.json and main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag $TAG is not on main"
            exit 1
          fi
      # No dependency cache here: a publish must not restore a cache another workflow wrote.
      # Node 24 bundles npm 11, which trusted publishing needs (11.5.1 or later). No registry-url:
      # npm publishes to registry.npmjs.org by default and trusted publishing needs no .npmrc,
      # while the token entry registry-url writes breaks Yarn Classic without NODE_AUTH_TOKEN.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: npm publish
